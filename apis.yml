aid: qwikwire
name: Qwikwire
description: >-
  Qwikwire, now operating as Aqwire, is a Philippine-founded cross-border
  payments company backed by 500 Global that bridges international payers with
  Philippine recipients, with a primary focus on the real estate sector.
  The platform lets overseas home buyers and investors pay property developers
  in multiple currencies while handling collection, reconciliation, and delivery
  of Philippine pesos to local bank accounts. Aqwire for Enterprise provides a
  payment dashboard for creating payment links, tracking transactions in real
  time, running auto-debit enrollments, and receiving daily automated reports,
  plus the Aqwire Connect (Access) API so merchants can integrate payment
  transaction creation into their own applications. This profile was surfaced as
  a portfolio company of 500 Global and enriched by the API Evangelist pipeline.
